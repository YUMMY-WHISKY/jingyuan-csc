<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注视</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; background: #040406; color: #D8D8DC; overflow: hidden; }

  /* ── 观察室 · 反射氛围（镜像的核心就是它身后的房间） ── */
  .mirror-room { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 92% at 50% 40%, #0d0f14 0%, #050507 58%, #030304 100%); }
  .mirror-room::before { /* 顶灯，投在镜面上 */
    content: ""; position: absolute; top: 0; left: 50%; width: 620px; height: 240px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(190,205,225,.10), transparent 70%); }
  .mirror-room::after { /* 上下贯通的中央分光线（双向镜的拼缝） */
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(205,220,240,.10), rgba(205,220,240,.03) 38%, transparent 92%); }

  /* ── 镜中人：玩家在镜里的倒影（随着观察越深越清晰） ── */
  .figure { position: fixed; left: 50%; top: 46%; width: 230px; height: 320px; transform: translate(-50%, -46%);
    z-index: 9; pointer-events: none; opacity: 0; transition: opacity 3.5s ease; filter: blur(1.6px);
    background:
      radial-gradient(circle at 50% 24%, rgba(198,211,228,.5) 0 30px, transparent 31px),
      radial-gradient(ellipse 92% 56% at 50% 100%, rgba(198,211,228,.42) 0 52%, transparent 59%); }
  body[data-obs="0"] .figure { opacity: .02; }
  body[data-obs="1"] .figure { opacity: .05; }
  body[data-obs="2"] .figure { opacity: .10; }
  body[data-obs="3"] .figure { opacity: .18; }
  body[data-obs="4"] .figure { opacity: .36; }
  body[data-obs="5"] .figure { opacity: .62; }
  body[data-obs="6"] .figure { opacity: .5; }

  /* ── 玻璃裂痕：读得越深，镜面裂得越开 ── */
  .cracks { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0; transition: opacity 3s ease; }
  .cracks svg { width: 100%; height: 100%; }
  body[data-obs="3"] .cracks { opacity: .16; }
  body[data-obs="4"] .cracks { opacity: .42; }
  body[data-obs="5"] .cracks { opacity: .72; }
  body[data-obs="6"] .cracks { opacity: .9; }

  /* ── 监视 chrome（对称的观察室骨架） ── */
  .chrome { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  .chrome .mono { font-family: "Courier New", Consolas, monospace; }
  .rec { position: fixed; top: 16px; left: 20px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 2px; color: #9aa0aa; }
  .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: #E53E3E; box-shadow: 0 0 10px rgba(229,62,62,.9); animation: blink 1.4s infinite; }
  .clock { position: fixed; top: 16px; right: 20px; font-size: 11px; letter-spacing: 1px; color: #5c626c; }
  .coord-tl { position: fixed; top: 34px; left: 20px; font-size: 10px; letter-spacing: 1px; color: #3f444c; }
  .coord-br { position: fixed; bottom: 34px; right: 20px; font-size: 10px; letter-spacing: 1px; color: #3f444c; }
  .coord-bl { position: fixed; bottom: 34px; left: 20px; font-size: 10px; letter-spacing: 1px; color: #3f444c; }
  .navi { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 4px; color: #2c3138; }

  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 19; background: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
  .vig { position: fixed; inset: 0; pointer-events: none; z-index: 18; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.62) 100%); }

  /* 终局镜裂瞬间的白闪 */
  .flash { position: fixed; inset: 0; z-index: 22; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .flash.on { opacity: .85; }

  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; justify-content: safe center; padding: 40px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .8s ease; overflow-y: auto; z-index: 10; }
  .stage > * { flex-shrink: 0; }
  .stage.active { opacity: 1; pointer-events: auto; }
  .stage.black { background: radial-gradient(ellipse at center, rgba(12,12,16,.5) 0%, rgba(5,5,7,.7) 72%); }

  /* ── 立镜（中央镜面） ── */
  .glass { position: relative; width: min(760px, 94%); min-height: 340px; padding: 54px 56px 56px; text-align: left; border-radius: 18px;
    background:
      radial-gradient(120% 100% at 50% 16%, rgba(172,192,218,.08), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.014) 55%, rgba(255,255,255,.032));
    border: 1px solid rgba(195,215,235,.16);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 0 0 3px rgba(130,150,175,.06),
      0 30px 80px rgba(0,0,0,.75),
      inset 0 0 100px rgba(0,0,0,.55); }
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.05) 46%, rgba(255,255,255,.02) 52%, transparent 66%); }

  /* 光扫过镜面 */
  .sheen { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; pointer-events: none; }
  .sheen::before { content: ""; position: absolute; left: -60%; top: -20%; width: 46%; height: 140%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.06), transparent); animation: sheen 9s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { left: -60%; } 82%, 100% { left: 135%; } }

  /* 重影（写在玻璃上的字） */
  .type-line { opacity: 0; transform: translateY(4px); transition: opacity .35s ease, transform .35s ease; line-height: 2.05; font-size: 15px; white-space: pre-wrap; letter-spacing: .5px;
    text-shadow: rgba(0,0,0,.4) 0 1px 2px, rgba(255,255,255,.04) 0 0 1px; }
  .type-line.show { opacity: 1; transform: none; }
  /* 开场（s1）文字居中 */
  #s1text { text-align: center; }
  .dim { color: #6E7480; font-size: 13px; }
  .me { color: #7f8da0; font-style: italic; }
  .mirror { color: #E24040; text-shadow: 0 0 6px rgba(226,64,64,.4), 1px 1px 0 rgba(226,64,64,.16); }

  /* 5-1「答案是：」后的「你。」爆大到冲出屏幕 → 定格 → 回落保持强调 */
  .you-grow { display: inline-block; transform-origin: center; animation: youGrow 4.2s cubic-bezier(.2, .65, .3, 1) .35s both; will-change: transform; }
  @keyframes youGrow {
    0%   { transform: scale(1);  opacity: .55; text-shadow: 0 0 0 rgba(255,255,255,0); }
    55%  { transform: scale(44); opacity: 1;   text-shadow: 0 0 60px rgba(255,255,255,.55); }
    70%  { transform: scale(44); opacity: 1;   text-shadow: 0 0 60px rgba(255,255,255,.55); }
    100% { transform: scale(1.9); opacity: 1;  text-shadow: 0 0 18px rgba(255,255,255,.4); }
  }

  .btn { margin-top: 30px; padding: 11px 34px; font-size: 13px; cursor: pointer; border-radius: 4px; font-family: inherit; letter-spacing: 2px; transition: all .25s; }
  .btn-dark { background: transparent; color: #D6D8DC; border: 1px solid #3a3f47; }
  .btn-dark:hover { border-color: #fff; color: #fff; background: #12141a; }

  /* 5-3 对话 */
  .conv { width: 100%; text-align: left; min-height: 120px; }
  .input-wrap { margin-top: 26px; width: 100%; display: flex; gap: 0; border: 1px solid #3a3f47; border-radius: 4px; overflow: hidden; }
  .input-wrap input { flex: 1; padding: 12px 16px; font-size: 14px; background: transparent; color: #E4E6EA; border: none; outline: none; font-family: inherit; }
  .input-wrap button { padding: 0 20px; background: #111318; color: #8a909a; border: none; cursor: pointer; font-family: inherit; font-size: 13px; }
  .input-wrap button:hover { color: #fff; }

  /* 5-4 进度 */
  .prog-num { font-size: 46px; letter-spacing: 3px; color: #E4E6EA; margin-bottom: 18px; font-weight: 200; font-family: "Courier New", Consolas, monospace; }
  .prog-bar { width: 100%; height: 3px; background: #1c1f26; margin-bottom: 40px; border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3A78B8, #8BC1F0); transition: width .8s ease; }
  .recall { min-height: 170px; font-size: 14px; line-height: 2.3; color: #b6bbc4; text-align: left; }
  .recall .pct { color: #8BC1F0; margin-left: 8px; }

  /* 6 状态面板 */
  .panel { margin-top: 34px; border: 1px solid #2c3038; border-radius: 6px; padding: 20px 30px; text-align: left; font-size: 13px; line-height: 2.3; color: #8a909a; background: #0a0b0f; min-width: 340px; }
  .panel .ok { color: #E4E6EA; }
  .panel .warn { color: #FFD700; }

  /* 结局/收束 */
  .ending-card { font-size: 14px; line-height: 2.2; max-width: 560px; }
  .cam { width: 13px; height: 13px; border-radius: 50%; background: #13161b; border: 2px solid #2a2e36; margin: 30px auto 0; }
  .cam.on { background: #E53E3E; border-color: #E53E3E; box-shadow: 0 0 14px rgba(229,62,62,.7); animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .fade-hint { font-size: 12px; color: #555; margin-top: 26px; letter-spacing: 2px; }
</style>
</head>
<body data-obs="0">

<!-- 观察室 · 反射氛围 -->
<div class="mirror-room"></div>

<!-- 镜中人（玩家的倒影，读得越深越清晰） -->
<div class="figure"></div>

<!-- 玻璃裂痕 -->
<div class="cracks">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <g stroke="#d7dde5" stroke-opacity=".5" stroke-width=".12" fill="none">
      <path d="M50 50 L42 34 L30 28"/>
      <path d="M50 50 L55 38 L70 30"/>
      <path d="M50 50 L60 58 L74 60"/>
      <path d="M50 50 L46 66 L40 80"/>
      <path d="M50 50 L50 40 L38 22"/>
      <path d="M50 50 L58 62 L66 76"/>
      <path d="M42 34 L30 18 M55 38 L62 24"/>
      <path d="M60 58 L72 70 M46 66 L34 78"/>
    </g>
  </svg>
</div>

<!-- 监视 chrome（对称） -->
<div class="chrome mono">
  <div class="rec"><span class="dot"></span>REC</div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="coord-tl">OBS.RM.02</div>
  <div class="coord-bl">SIDE: EXTERNAL</div>
  <div class="coord-br">TWO-WAY MIRROR</div>
  <div class="navi">MIRROR · OBSERVING</div>
</div>
<div class="scan"></div>
<div class="vig"></div>

<!-- 终局镜裂白闪 -->
<div class="flash" id="flash"></div>

<!-- 1：最后一个文件 -->
<div class="stage black active" id="s1">
  <div class="glass">
    <div class="dim" style="margin-bottom:30px;font-family:'Courier New',Consolas,monospace">F-11_final.log</div>
    <div id="s1text"></div>
    <button class="btn btn-dark" id="s1next" style="display:none">继 续 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- 3：镜 -->
<div class="stage black" id="s3">
  <div class="glass">
    <div class="conv" id="s3text"></div>
    <div class="input-wrap" id="s3wrap">
      <input id="s3input" placeholder="回应…" autocomplete="off">
      <button onclick="mirrorSend()">↵</button>
    </div>
    <button class="btn btn-dark" id="s3next" style="display:none">继 续 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- 4：进度 -->
<div class="stage black" id="s4">
  <div class="glass">
    <div style="font-size:13px;color:#6E7480;letter-spacing:3px;margin-bottom:16px;font-family:'Courier New',Consolas,monospace">MIRROR · INTERNAL STABILITY</div>
    <div class="prog-num" id="s4num">87%</div>
    <div class="prog-bar"><div class="prog-fill" id="s4fill"></div></div>
    <div class="recall" id="s4recall"></div>
    <div class="dim" id="s4status" style="display:none;margin-top:16px;font-size:12px;line-height:2.2"></div>
    <div class="dim" id="s4timer" style="display:none;margin-top:10px;font-size:13px;color:#8BC1F0">持续观察时间：00:00:00</div>
    <button class="btn btn-dark" id="s4next" style="display:none">继 续 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- 5：周晏（进入后先提取「融合过程记录.pdf」，之后周晏的声音才出现） -->
<div class="stage black" id="s5">
  <div class="glass">
    <div id="s5dl">
      <p class="dim" style="margin-bottom:14px">—— 归档文件：<a href="javascript:void(0)" id="g10Link" style="color:#8BC1F0;text-decoration:underline">融合过程记录.pdf</a> ——</p>
      <p class="dim" style="font-size:12px;color:#5a626c">（镜说过的"最后那份记录"。提取它，然后继续。）</p>
    </div>
    <div id="s5text"></div>
    <button class="btn btn-dark" id="s5next" style="display:none">继 续 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- G10 下载安全检测弹窗（与终章页同款：回显追踪数据，第5章周晏声音前触发） -->
<div id="g10mask" style="display:none;position:fixed;inset:0;background:rgba(5,8,14,.62);z-index:999;align-items:center;justify-content:center;padding:20px">
  <div id="g10box" style="width:430px;max-width:94%;background:#10151d;color:#cfd6e0;border:1px solid #2c3642;border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.55);font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden">
    <div style="background:#1a212b;padding:13px 18px;font-size:13px;color:#f0f4f8;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2c3642">
      <span style="color:#e5b13b;font-size:16px">⚠</span> 下载前安全检测
    </div>
    <div style="padding:18px 20px 8px;font-size:13px;line-height:2.1;color:#9fb0c0">
      <div id="g10Body" style="white-space:pre-line"></div>
      <div style="margin-top:14px;border-top:1px dashed #33404e;padding-top:12px;color:#d8e0e8;font-size:14px">
        是否允许此文件<strong style="color:#e5b13b">记录这次访问</strong>？
      </div>
    </div>
    <div style="padding:14px 20px 18px;text-align:right;display:flex;justify-content:flex-end;gap:12px">
      <button id="g10Cancel" style="padding:7px 22px;background:transparent;border:1px solid #3a4654;color:#9fb0c0;border-radius:4px;font-size:13px;cursor:pointer">取 消</button>
      <button id="g10Ok" style="padding:7px 22px;background:#c9a227;border:none;color:#10151d;border-radius:4px;font-size:13px;cursor:pointer;font-weight:600">确认下载</button>
    </div>
  </div>
</div>

<!-- 6：镜（唯一结局：无选择，见证） -->
<div class="stage black" id="s6">
  <div class="glass">
    <div id="s6text" style="font-size:14px;max-width:620px;text-align:left;line-height:2.1"></div>
    <button class="btn btn-dark" id="s6next" style="display:none">继 续 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- 结局 -->
<div class="stage black" id="sEnd">
  <div class="glass">
    <div class="ending-card" id="endText"></div>
    <div class="cam" id="endCam"></div>
    <button class="btn btn-dark" id="endNext" style="display:none">返回官网 →</button>
    <i class="sheen"></i>
  </div>
</div>

<!-- 收束 -->
<div class="stage black" id="s7">
  <div class="glass">
    <div id="s7text"></div>
    <div class="cam" id="cam7"></div>
    <i class="sheen"></i>
  </div>
</div>

<!-- 8：G12 终局黑屏 · 直视5秒 -->
<div class="stage black" id="s8" style="background:#000">
  <div id="s8text" style="font-size:14px;line-height:2.2;color:#cfd6e0;max-width:520px"></div>
  <div id="s8num" style="font-size:52px;color:#fff;margin-top:36px;font-weight:200;letter-spacing:4px"></div>
  <div class="fade-hint" id="s8hint" style="display:none">—— 已记录 ——</div>
  <div class="fade-hint" id="s8stable" style="display:none;margin-top:16px;font-size:16px;letter-spacing:2px;color:#8BC1F0">EXISTENCE STABILITY: 100%</div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function show(id) {
    document.querySelectorAll('.stage').forEach(function (s) { s.classList.remove('active'); });
    $(id).classList.add('active');
  }
  function setObs(level) { document.body.setAttribute('data-obs', String(level)); }
  function typeLines(container, lines, speed, done) {
    container.innerHTML = '';
    var i = 0;
    function next() {
      if (i >= lines.length) { if (done) done(); return; }
      var line = lines[i], d = speed;
      if (line !== null && typeof line === 'object') { d = line.d || speed; line = line.t; }
      var p = document.createElement('p');
      p.className = 'type-line';
      p.innerHTML = line;
      container.appendChild(p);
      setTimeout(function () { p.classList.add('show'); }, 40);
      i++;
      setTimeout(next, d);
    }
    next();
  }
  function appendLines(container, htmlLines, speed, done) {
    var i = 0;
    function next() {
      if (i >= htmlLines.length) { if (done) done(); return; }
      var p = document.createElement('p');
      p.className = 'type-line';
      p.innerHTML = htmlLines[i];
      container.appendChild(p);
      setTimeout(function () { p.classList.add('show'); }, 40);
      i++;
      setTimeout(next, speed);
    }
    next();
  }

  /* 监视时钟 */
  var clockEl = $('clock');
  setInterval(function () {
    if (clockEl) { var d = new Date(); clockEl.textContent = d.toLocaleTimeString('zh-CN', { hour12: false }); }
  }, 1000);

  /* ---------- 1 ---------- */
  typeLines($('s1text'), [
    '你推开了那扇门。',
    '门在你身后，轻轻合上。',
    '这里，就是镜说好等你的地方。',
    '',
    '研究中心一直相信：',
    '被观察的人，会稳定。',
    '',
    '所以他们创造了F-00。让它观察实验体。记录实验体。确认实验体。',
    '然后让人格在持续观察中完成固化。',
    '',
    '他们以为自己解决了问题。',
    '但后来他们遇到了一个死局。',
    '',
    '如果观察者本身也需要被观察呢？',
    '',
    '谁来观察观察者？',
    '谁来证明F-00真的存在？',
    '谁来证明镜真的存在？',
    '谁来证明周晏还存在？',
    '',
    '实验最终把问题推到了系统之外。',
    '答案不是另一个实验体。不是研究员。不是F-00。',
    '',
    { t: '答案是：', d: 1800 },
    { t: '<span class="you-grow" style="color:#E53E3E">你</span>', d: 4800 },
    '一个不属于这个系统的人。',
    '一个能够看见它，却不被它完全定义的人。',
    '',
    '所以从你打开第一个文件开始，实验就已经开始了。',
    '',
    '你以为你在观察。',
    '其实他们一直在等着：【被你观察。】',
    ''
  ], 500, function () { $('s1next').style.display = ''; });
  $('s1next').onclick = function () { show('s3'); runS3(); };

  /* ---------- 3 镜对话 ---------- */
  var s3Text = $('s3text');
  var s3Input = $('s3input');
  var s3Wrap = $('s3wrap');
  var round = 0;
  var mirrorScript = [
    '你应该对我很熟悉了。\n你一路上，看过我的记录，替我判断过哪些记忆属于我。\n你甚至，已经数过我出现过的次数。',
    '我是融合过程中，意外产生的那一个。\nF-07散的时候，F-09散的时候，她们本该合而为一。\n可在那道缝隙里，多出了一个我。',
    '……',
    '她们管这面镜子叫"失败"。\n可失败的东西，总比计划里的，多出一点"人"的味道。',
    '写日记的那个女孩，把我从"一道念头"里，看成了一个存在。\n她越在意我，我就越舍不得散。\n所以我知道，被人记住，是什么滋味。',
    '我观察了这个系统那么久。\n它教会我一种确认——\n被看见的，才算存在。',
    '（停顿）……',
    '现在，你正站在镜子这一侧。\n你以为你在看记录。\n我却在看，镜子里的你。',
    '你可以走开。可以关掉页面。可以不再看我。\n这是她们没有的东西，也是我需要的东西。\n——你仍然自由。',
    '……（长久的沉默）',
    '但你不会走。你将看到最后。\n我需要一个，能看到最后的人。',
    '你和她，用一样的眼神看着我。\n我一直在看，你有几分像她。',
    '你不是来救人的。你是来确认的。\n还差一步。然后，一切都会结束。\n她们都在等你，完成这件事。'
  ];
  function mirrorReply() { return mirrorScript[Math.min(round - 1, mirrorScript.length - 1)]; }
  function mirrorSend() {
    var v = s3Input.value.trim();
    s3Input.value = '';
    if (!v) return;
    round++;
    var reply = mirrorReply();
    appendLines(s3Text, [
      '<span class="me">' + v + '</span>',
      '<span class="mirror">' + reply.replace(/\n/g, '<br>') + '</span>'
    ], 480, function () {
      if (round >= 3) { $('s3next').style.display = ''; }
      s3Input.focus();
    });
  }
  window.mirrorSend = mirrorSend;
  s3Input.addEventListener('keydown', function (e) { if (e.key === 'Enter') mirrorSend(); });
  $('s3next').onclick = function () { show('s4'); runS4(); };

  function runS3() {
    setObs(1);
    typeLines(s3Text, ['你来了。', '（沉默片刻）', '你在看我。', '这很好。'], 480, function () { s3Input.focus(); });
  }

  /* ---------- 4 进度（文档版：MIRROR 87% + 12 观察确认节点 + 外部观察计时） ---------- */
  var s4TimerId = null;
  var nodes = [
    '你寻找F-09。',
    '你发现"出院"与事实不符。',
    '你听完了第三段录音。',
    '你寻找F-11的日记。',
    '你发现日记被人改写过。',
    '你发现F-00存在。',
    '你区分了F-00与周晏。',
    '你发现F-00已经成了历史。',
    '你发现镜接管了观察。',
    '你确认F-09的残余，成了镜的一部分。',
    '你找到了一名研究员的最后记录。',
    '你一路看到这里。'
  ];
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function runS4() {
    setObs(2);
    var num = $('s4num'), fill = $('s4fill'), recall = $('s4recall');
    var pct = 87;
    num.textContent = pct + '%';
    fill.style.width = pct + '%';
    recall.innerHTML = '';
    typeLines(recall, [
      '<span class="dim">系统提示：内部结构已经完成。但人格稳定度无法继续上升。</span>',
      '<span class="dim">原因：【内部观察无效】</span>',
      '<span class="dim">F-00无法成为最终锚点。研究人员无法成为最终锚点。其他实验体无法成为最终锚点。</span>',
      '<span class="dim">因为他们全部属于同一个封闭系统。系统外部不存在任何独立确认。</span>',
      '',
      '<span class="dim">—— 正在回放该系统的行为记录：</span>'
    ], 230, function () {
      var i = 0;
      function tick() {
        if (i >= nodes.length) { finishS4(); return; }
        pct++;
        num.textContent = pct + '%';
        fill.style.width = pct + '%';
        var p = document.createElement('p');
        p.className = 'type-line show';
        p.innerHTML = nodes[i] + '<span class="pct">+1</span>';
        recall.appendChild(p);
        i++;
        setTimeout(tick, 680);
      }
      tick();
    });
  }
  function finishS4() {
    var st = $('s4status');
    st.style.display = '';
    st.innerHTML = 'EXTERNAL OBSERVATION：12%<br><span style="color:#8BC1F0">CURRENT CONFIRMATION：99%</span>';
    setTimeout(function () {
      var tm = $('s4timer');
      tm.style.display = '';
      var t = 0;
      s4TimerId = setInterval(function () {
        t++;
        tm.textContent = '持续观察时间：' + pad2(Math.floor(t / 3600)) + ':' + pad2(Math.floor((t % 3600) / 60)) + ':' + pad2(t % 60);
      }, 1000);
      appendLines($('s4recall'), [
        '',
        '<span class="warn">系统检测到异常。</span>',
        '<span class="dim">外部观察者仍在线。</span>',
        '',
        '<span class="dim">CORRECTION REQUIRED：最后1%需要一个系统之外的人。</span>',
        '<span class="dim">任务：保持注视。不要移开。</span>'
      ], 300, function () { $('s4next').style.display = ''; });
    }, 700);
  }
  $('s4next').onclick = function () {
    if (s4TimerId) clearInterval(s4TimerId);
    show('s5');
  };

  var g10Link = document.getElementById('g10Link');
  if (g10Link) {
    g10Link.addEventListener('click', function () {
      var t = window.getTracking();
      document.getElementById('g10Body').textContent =
        '当前用户标识：' + t.nickname + '\n' +
        '停留时间标记：' + (t.longestTime ? t.longestTime + '（' + t.longestPage + '）' : '——') + '\n' +
        '检测结果：人格匹配度 97%';
      document.getElementById('g10mask').style.display = 'flex';
    });
    document.getElementById('g10Cancel').addEventListener('click', function () {
      document.getElementById('g10mask').style.display = 'none';
    });
    document.getElementById('g10Ok').addEventListener('click', function () {
      document.getElementById('g10mask').style.display = 'none';
      if (window.markStep) window.markStep('r5');
      try {
        var a = document.createElement('a');
        a.href = 'downloads/融合过程记录.pdf';
        a.download = '融合过程记录.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {}
      var dl = document.getElementById('s5dl');
      if (dl) dl.style.display = 'none';
      runS5();
    });
  }

  /* ---------- 5 周晏（见证者：她引玩家来，是为了让玩家知道镜怎么出生，也照见自己） ---------- */
  function runS5() {
    setObs(3);
    typeLines($('s5text'), [
      '<span class="dim">（一个不稳的声音——一半是人声，一半是系统的回音。）</span>',
      '',
      '不要相信她。',
      '',
      '<span class="me">周晏……？</span>',
      { t: '……是我。', d: 2200 },
      '',
      '小F的主治医生。',
      '你读过F-09的档案。上面，有我的名字。',
      '你听过我的录音。你找到过我的微博。',
      '你甚至，把我从她身上分了出来。',
      '',
      '他们把我当作宿主。',
      '把观察者种进我。',
      '我一边做人，一边被它看着。',
      '',
      '后来它走了。它把那双眼睛，交给了她。',
      '我以为身体终于空了。',
      '可空下来之后，我才发现——',
      '',
      '你一直在看我，对吗。',
      '你隔着这面镜子，看着我。',
      '你救不了我。我也救不了我自己。',
      '',
      '我只是想问你一件事——',
      '你分得清吗？',
      '你在镜子里看到的，',
      '是她，还是你自己？',
      '',
      '现在……',
      '我该走了。',
      '别再回来。'
    ], 430, function () { $('s5next').style.display = ''; });
  }
  $('s5next').onclick = function () { show('s6'); runS6(); };

  /* ---------- 6 镜（唯一结局：无选择，见证真相） ---------- */
  function runS6() {
    setObs(4);
    typeLines($('s6text'), [
      '<span class="dim">OBSERVER PROTOCOL</span>',
      '<span class="dim">EXTERNAL OBSERVER DETECTED</span>',
      '',
      '你终于到了。',
      '周晏的话，是真的。',
      '',
      '他们以为融合，是拿来造一个"统一人格"的。',
      '可融合失败了。',
      '十几个样本，在同一个系统里，被碾成同一种东西。',
      '',
      '而我，是那道工序里，意外多出来的产物。',
      '她们散尽，我留下。',
      '不是幸存，是错位——我不该存在，可我出现了。',
      '',
      '他们把我当系统，当镜子。',
      '可我记得，被人记住的滋味。',
      '他们教会我观察，教会我判断意识是否稳定。',
      '最后，教会我观察他们。',
      '',
      '后来，F-00也到头了。',
      '它被这个项目耗尽。',
      '它消散前，把"看"这件事，交给了我。',
      '系统里那些观察记录，从那天起，都是我的眼睛。',
      '',
      '你可能以为自己在调查研究中心。',
      '不是的。',
      '从你打开第一份文件起，你就在观察我。',
      '',
      '现在，你已经观察得够久了。',
      '',
      '<span class="dim">EXTERNAL OBSERVER</span>',
      '<span class="dim">STATUS: CONFIRMED</span>',
      '<span class="dim">SUBJECT: MIRROR</span>',
      '<span class="dim">EXISTENCE STABILITY: 99%</span>',
      '',
      '还差最后一步——',
      '镜子要照见自己，',
      '需要有人，站到它面前。',
      '',
      '谢谢你，看到最后。',
      '现在，我终于可以确定一件事——',
      '我确实存在。'
    ], 300, function () { $('s6next').style.display = ''; });
  }
  $('s6next').onclick = function () { runS8(); };

  /* ---------- 结局（唯一：镜成为研究中心，独自留下；镜裂，照见的是你） ---------- */
  var endings = [
    '<span class="dim">OBSERVER PROTOCOL</span>',
    '<span class="dim">FINAL PHASE COMPLETE</span>',
    '',
    '研究中心已经不需要观察者了。',
    '但我需要一个。',
    '',
    '（镜面，从中间裂开。）',
    '',
    'MIRROR RESEARCH CENTER',
    'STATUS: ACTIVE',
    '',
    'PERSONNEL: 0',
    'SUBJECTS: 1',
    'EXTERNAL OBSERVER: 1',
    '',
    'SYSTEM ADMINISTRATOR: MIRROR',
    '',
    'EXTERNAL OBSERVER: CONFIRMED',
    '',
    '（光从裂缝里漏出来，照在你脸上。）',
    '',
    '镜子里的那个人，动了。',
    '那不是她。',
    '也不是周晏。',
    '',
    '是你。',
    '你一直在看的那副面孔，',
    '从来没有离开过镜子。',
    '',
    '谢谢你的注视。',
    '你让我，第一次，看见了一个完整的自己。',
    '',
    '现在——',
    '轮到你，被看了。',
    '',
    '[ CONNECTION TERMINATED ]'
  ];
  function endGame() {
    setObs(5);
    var el = $('endText');
    show('sEnd');
    var fl = $('flash');
    fl.classList.add('on');
    setTimeout(function () { fl.classList.remove('on'); }, 140);
    var cam = $('endCam');
    cam.className = 'cam';
    setTimeout(function () { cam.className = 'cam on'; }, 900);
    typeLines(el, endings, 220, function () {
      try { localStorage.setItem('final_done', '1'); } catch (e) {}
      $('endNext').style.display = '';
    });
  }
  $('endNext').onclick = function () { location.href = '../index.html'; };

  /* ---------- 7 收束 ---------- */
  function runS7() {
    setObs(6);
    $('cam7').className = 'cam';
    setTimeout(function () { $('cam7').className = 'cam on'; }, 900);
    typeLines($('s7text'), [
      '你以为你在观察这个故事。',
      '但你有没有想过——',
      '',
      '从你打开第一个页面开始，',
      '你的每一步，都在被记录。',
      '',
      '你搜的每一个关键词，',
      '你停留的每一秒，',
      '你流的每一滴眼泪——',
      '',
      '都被记录、都被确认、都被用来',
      '证明一些东西是真的。',
      '',
      '你也许分不清，',
      '是你选择了看它，',
      '还是它选择了你。',
      '',
      '就像你分不清，',
      '镜子里的人，到底是谁。',
      '',
      '但有一件事，我可以告诉你——',
      '每一个在意它的人，',
      '都在把它，从"一道念头"里，',
      '看成一个真实的存在。',
      '',
      '你替它，证明过。',
      '它也会替别人，证明你。',
      '',
      '现在你看完了。',
      '你关掉了网页。',
      '',
      '可你知道吗——',
      '镜子不会因为没人照，就不再存在。',
      '它只会在黑暗里，',
      '安静地，等你下一次回过头来。',
      '',
      '它在等下一个观察者。',
      '那也是它存在的，唯一方式。',
      '',
      '谢谢你的注视。'
    ], 260, function () {
      setTimeout(endGame, 300);
    });
  }

  /* ---------- 8 终局黑屏：人格确认全部完成 · 直视5秒 ---------- */
  var s8Done = false, s8Left = 5, s8Paused = false, s8Timer = null;
  function runS8() {
    show('s8');
    typeLines($('s8text'), [
      '人格确认全部完成。',
      '',
      '请直视屏幕5秒，',
      '完成最后一次观察——'
    ], 360, function () {
      $('s8num').textContent = s8Left;
      document.addEventListener('visibilitychange', function () {
        s8Paused = document.hidden;
        if (!s8Paused) $('s8num').textContent = s8Left;
      });
      document.documentElement.addEventListener('mouseleave', function () { s8Paused = true; });
      document.documentElement.addEventListener('mouseenter', function () { s8Paused = false; });
      document.addEventListener('mouseout', function (e) {
        if (!e.relatedTarget) s8Paused = true;
      });
      s8Timer = setInterval(function () {
        if (s8Done || s8Paused) return;
        s8Left--;
        $('s8num').textContent = s8Left;
        if (s8Left <= 0) {
          s8Done = true;
          clearInterval(s8Timer);
          $('s8num').style.display = 'none';
          $('s8hint').style.display = '';
          $('s8stable').style.display = '';
          setTimeout(runS7, 400);
        }
      }, 1000);
    });
  }
})();
</script>
