<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <!-- fMRI 脑影像（占位图：正式版换真实感脑图素材） -->
  <defs>
    <radialGradient id="blob1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E25C4A" stop-opacity=".8"/>
      <stop offset="1" stop-color="#E25C4A" stop-opacity=".25"/>
    </radialGradient>
    <radialGradient id="blob2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E8A54B" stop-opacity=".85"/>
      <stop offset="1" stop-color="#E8A54B" stop-opacity=".25"/>
    </radialGradient>
    <radialGradient id="blob3" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4A90D9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4A90D9" stop-opacity=".25"/>
    </radialGradient>
  </defs>
  <circle cx="160" cy="122" r="108" fill="#F4F8FC" stroke="#C5D8EA" stroke-width="2"/>
  <!-- 大脑功能区色斑 -->
  <ellipse cx="120" cy="100" rx="52" ry="40" fill="url(#blob1)"/>
  <ellipse cx="205" cy="90" rx="46" ry="34" fill="url(#blob2)"/>
  <ellipse cx="150" cy="165" rx="60" ry="44" fill="url(#blob3)"/>
  <ellipse cx="230" cy="160" rx="36" ry="30" fill="url(#blob2)" opacity=".7"/>
  <ellipse cx="95" cy="160" rx="30" ry="26" fill="url(#blob3)" opacity=".6"/>
  <!-- 脑沟纹理 -->
  <g stroke="#FFFFFF" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M118 78 Q128 96 122 112"/>
    <path d="M200 70 Q208 86 202 100"/>
    <path d="M140 130 Q158 140 172 132"/>
    <path d="M160 170 Q170 182 180 172"/>
